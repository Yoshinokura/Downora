name: Windows build

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Run automated tests
        run: dotnet test tests/Downora.Tests/Downora.Tests.csproj --configuration Release

      - name: Publish self-contained Windows app
        run: dotnet publish src/Downora/Downora.csproj --configuration Release --runtime win-x64 --self-contained true --output publish
      - name: Verify published executable is x64
        shell: pwsh
        run: |
          $bytes = [System.IO.File]::ReadAllBytes("publish/Downora.exe")
          $peOffset = [System.BitConverter]::ToInt32($bytes, 0x3C)
          $machine = [System.BitConverter]::ToUInt16($bytes, $peOffset + 4)
          if ($machine -ne 0x8664) { throw ("Expected AMD64 PE machine 0x8664, got 0x{0:X4}" -f $machine) }
          Write-Host "Verified Downora.exe PE machine: AMD64 (0x8664)"

      - name: Validate bundled eD2k setup script
        shell: pwsh
        run: |
          $script = Get-Content scripts/Install-Ed2kEngine.ps1 -Raw
          $tokens = $null
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseInput($script, [ref]$tokens, [ref]$errors) | Out-Null
          if ($errors.Count -gt 0) { $errors | ForEach-Object { Write-Error $_ }; exit 1 }
          if (-not (Test-Path publish/scripts/Install-Ed2kEngine.ps1)) { throw 'The eD2k setup script was not included in the published app.' }

      - name: Install Inno Setup
        run: choco install innosetup --no-progress -y

      - name: Build Windows installer
        shell: pwsh
        run: |
          $version = if ($env:GITHUB_REF -like "refs/tags/v*") { $env:GITHUB_REF_NAME.Substring(1) } else { "0.1.$env:GITHUB_RUN_NUMBER" }
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" "/DAppVersion=$version" "installer/Downora.iss"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: Downora-Windows-Setup
          path: installer/output/Downora-Setup.exe
          if-no-files-found: error
          retention-days: 30

  build-arm64:
    name: Build Windows ARM64 installer
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Publish self-contained Windows ARM64 app
        run: dotnet publish src/Downora/Downora.csproj --configuration Release --runtime win-arm64 --self-contained true --output publish
      - name: Verify published executable is ARM64
        shell: pwsh
        run: |
          $bytes = [System.IO.File]::ReadAllBytes("publish/Downora.exe")
          $peOffset = [System.BitConverter]::ToInt32($bytes, 0x3C)
          $machine = [System.BitConverter]::ToUInt16($bytes, $peOffset + 4)
          if ($machine -ne 0xAA64) { throw ("Expected ARM64 PE machine 0xAA64, got 0x{0:X4}" -f $machine) }
          Write-Host "Verified Downora.exe PE machine: ARM64 (0xAA64)"

      - name: Validate bundled eD2k setup script
        shell: pwsh
        run: |
          $script = Get-Content scripts/Install-Ed2kEngine.ps1 -Raw
          $tokens = $null
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseInput($script, [ref]$tokens, [ref]$errors) | Out-Null
          if ($errors.Count -gt 0) { $errors | ForEach-Object { Write-Error $_ }; exit 1 }
          if (-not (Test-Path publish/scripts/Install-Ed2kEngine.ps1)) { throw 'The eD2k setup script was not included in the ARM64 publish output.' }

      - name: Install Inno Setup
        run: choco install innosetup --no-progress -y

      - name: Build Windows ARM64 installer
        shell: pwsh
        run: |
          $version = if ($env:GITHUB_REF -like "refs/tags/v*") { $env:GITHUB_REF_NAME.Substring(1) } else { "0.1.$env:GITHUB_RUN_NUMBER" }
          & "C:\\Program Files (x86)\\Inno Setup 6\\ISCC.exe" "/DAppVersion=$version" "/DAppArchitecture=arm64" "/DOutputBaseName=Downora-Setup-ARM64" "installer/Downora.iss"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Upload ARM64 installer
        uses: actions/upload-artifact@v4
        with:
          name: Downora-Windows-ARM64-Setup
          path: installer/output/Downora-Setup-ARM64.exe
          if-no-files-found: error
          retention-days: 30

  publish-beta:
    name: Publish GitHub beta release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [ build, build-arm64 ]
    runs-on: ubuntu-latest
    steps:
      - name: Download x64 and ARM64 installers
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Publish beta release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Downora ${{ github.ref_name }} Beta
          prerelease: true
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            release-assets/Downora-Setup.exe
            release-assets/Downora-Setup-ARM64.exe
          body: |
            ## Downora Beta / 测试版

            This is a pre-release for testing, not a stable release.
            此版本仅供测试，不代表正式稳定版。

            - Windows x64 installer: `Downora-Setup.exe`
            - Windows ARM64 installer: `Downora-Setup-ARM64.exe`

            Please report bugs through GitHub Issues. Back up important downloads and settings before upgrading.
